[project]
name = "recoup"
version = "0.1.0"
description = "Payer-contract underpayment audits with clause-level citations"
readme = "README.md"
authors = [
    { name = "Peter Hyland" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
claude = [
    "anthropic>=2.6.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
recoup = "recoup.cli:app"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # the formatter owns line length

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends", "fastapi.Query", "fastapi.File"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true  # optional extra: `uv sync --extra claude`
